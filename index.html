<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starlit ASCII Bouquet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div id="stars"></div>
    <pre id="shoot" class="shoot">*-·--- -- -  .</pre>
  </div>

  <main class="bouquet" role="img"
        aria-label="A detailed ASCII art bouquet of colorful lilies under a starry night sky">
    <canvas id="flowers"></canvas>
    <div id="hearts" class="hearts" aria-hidden="true"></div>
  </main>

  <p class="caption">~ for you, under the stars ~</p>

  <script src="script.js"></script>
</body>
</html>
